name: 📦 Daily D1 Backup

on:
  schedule:
    - cron: '0 3 * * *'  # ทุกวัน 03:00 น. UTC
  workflow_dispatch:      # กดรันเองได้จากแท็บ Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ สร้าง Backup ฐานข้อมูล D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: |
            wrangler d1 backup create line-stock --output backup_$(date +%Y%m%d_%H%M%S).sql
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
        
      - name: ✅ Backup สำเร็จ
        if: success()
        run: echo "Backup completed successfully!"
